[pytest]
# Put the repo root on sys.path so `from app.main import app` resolves when
# pytest is run from anywhere. Without this, collection fails with
# "ModuleNotFoundError: No module named 'app'" -- the app package lives at the
# repo root and is not installed into the venv.
pythonpath = .

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Tests force USE_MOCK_MODE=true, so the suite needs no API key and costs
# nothing. Keep it that way: anything that calls the real API belongs behind
# the `integration` marker.
markers =
    integration: hits the real Gemini API (needs GOOGLE_API_KEY, costs money)

addopts = -q --strict-markers
